[package]
name = "matter-rgb-lamp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rgb_lamp_wifi"
harness = false

[[bin]]
name = "dimmable_lamp_wifi"
harness = false

[patch.crates-io]
# rs-matter = { git = "https://github.com/project-chip/rs-matter" }
rs-matter = { git = "https://github.com/sysgrok/rs-matter", branch = "next" }
# rs-matter = { path = "../rs-matter-hicklin/rs-matter" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack.git", branch = "next" }
# rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack.git", rev = "f631ec6f073065fc6af8bfa482e4358d2da8756e" }
openthread = { git = "https://github.com/sysgrok/openthread.git", branch = "next" }

esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal", rev = "e156b5453a8adc123b7a8b6aa08e0698ec87dfe8" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[features]
default = ["esp32c6", "wifi", "log"]
esp32 = ["esp-rtos/esp32", "esp-hal/esp32", "esp-backtrace/esp32", "esp-println/esp32", "esp-radio/esp32", "esp-storage/esp32", "esp-bootloader-esp-idf/esp32", "esp-metadata-generated/esp32", "esp-hal-smartled/esp32", "portable-atomic/critical-section", "wifi"]
esp32c2 = ["esp-rtos/esp32c2", "esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-radio/esp32c2", "esp-storage/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp-metadata-generated/esp32c2", "portable-atomic/critical-section", "wifi"]
esp32c3 = ["esp-rtos/esp32c3", "esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-radio/esp32c3", "esp-storage/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-metadata-generated/esp32c3", "esp-hal-smartled/esp32c3", "portable-atomic/unsafe-assume-single-core", "wifi"]
esp32c6 = ["esp-rtos/esp32c6", "esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6", "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-metadata-generated/esp32c6", "esp-hal-smartled/esp32c6", "portable-atomic/critical-section", "wifi"]
esp32s3 = ["esp-rtos/esp32s3", "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-metadata-generated/esp32s3", "esp-hal-smartled/esp32s3", "portable-atomic/critical-section", "wifi"]
esp32h2 = ["esp-rtos/esp32h2", "esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-radio/esp32h2", "esp-storage/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-metadata-generated/esp32h2", "esp-hal-smartled/esp32h2", "portable-atomic/critical-section", "thread"]
wifi = ["rs-matter-embassy/embassy-net"]
thread = ["rs-matter-embassy/openthread"]
log = ["esp-hal/log-04", "esp-println/log-04", "esp-radio/log-04", "esp-bootloader-esp-idf/log-04", "rs-matter-embassy/log"]
defmt = ["dep:defmt", "esp-hal/defmt", "esp-println/defmt-espflash", "esp-radio/defmt", "esp-bootloader-esp-idf/defmt", "rs-matter-embassy/defmt"]

[dependencies]
log = "0.4"
embassy-executor = "0.9"
embassy-embedded-hal = "0.3"
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println"] }
esp-hal = { version = "1", features = ["unstable", "exception-handler"] }
esp-rtos = { version = "0.2", features = ["esp-radio", "embassy"] }
esp-alloc = { version = "0.9" }
esp-println = { version = "0.16" }
esp-radio = { version = "0.17", features = ["ble", "unstable"] }
esp-storage = "0.8"
esp-bootloader-esp-idf = { version = "0.4" }
esp-metadata-generated = "0.3"
# rs-matter-embassy = { path = "../rs-matter-embassy-hicklin/rs-matter-embassy", features = ["esp", "kv-blob-store-16384"] }
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy.git", features = ["esp", "kv-blob-store-16384"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }
embassy-futures = "0.1"
embassy-time = "0.5"
embassy-sync = "0.7"
static_cell = "2"
portable-atomic = "1"
# TODO: When rs-matter-embassy moves to esp-hal v1.1, replace the source of esp-hal-smartled with "https://github.com/esp-rs/esp-hal-community.git".
# Note: Also requires merging of this smartled PR: https://github.com/esp-rs/esp-hal-community/pull/62
# esp-hal-smartled = { path = "/home/hicklin/Documents/tmp/esp-hal-community/esp-hal-smartled"}
esp-hal-smartled = { git = "https://github.com/hicklin/esp-hal-community.git", branch = "rs-matter-package-match" }
smart-leds = "0.4.0"
palette = {version = "0.7.6", default-features = false, features = ["libm"]}
# rs-matter = { version = "0.1", default-features = false }
defmt = { version = "0.3", optional = true }

# Used for the RNG. Remove when esp_hal::rng::TrngSource does not consume any required peripherals.
rand_core = "0.9"
rand_chacha = { version = "0.9", default-features = false }
